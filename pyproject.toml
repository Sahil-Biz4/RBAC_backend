# ── Black ─────────────────────────────────────────────────────────────────
[tool.black]
line-length = 120
target-version = ["py312"]

# ── Ruff ──────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "T20",    # flake8-print (no print statements)
    "RET",    # flake8-return
    "C4",     # flake8-comprehensions
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "RET504", # unnecessary assignment before return
    "UP007",  # use X | Y for union types
    "RUF012", # mutable class attributes — ClassVar annotation not required here
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "T20",    # allow print in tests
    "B011",   # allow assert True/False in tests
    "E402",   # env vars must be set before app imports in conftest
]
"alembic/**/*.py" = [
    "ERA",    # allow commented code in migrations
    "I",      # don't enforce import order in migrations
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ── Coverage ───────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["*/alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
